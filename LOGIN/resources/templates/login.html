<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #f2f2f2; }
        .container { width: 400px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,.15); }
        h1 { text-align: center; margin-bottom: 10px; }
        .subtitulo { text-align: center; color: #777; margin-bottom: 30px; }
        .campo { margin-bottom: 20px; }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; }
        button { width: 100%; padding: 13px; border: none; border-radius: 7px; background: #222; color: white; font-size: 16px; cursor: pointer; }
        button:hover { background: #444; }
        .cadastro { text-align: center; margin-top: 20px; }
        a { color: #222; font-weight: bold; }
        .erro { color: red; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Login</h1>
    <p class="subtitulo">Entre na sua conta</p>

    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <form th:action="@{/login}" method="post">
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <button type="submit">Entrar</button>
    </form>

    <div class="cadastro">
        <p>Ainda não possui uma conta?
            <a th:href="@{/cadastro}">Cadastre-se</a>
        </p>
    </div>
</div>
</body>
</html>
